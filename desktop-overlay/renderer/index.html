<!doctype html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' data:; connect-src 'self' https://dyrelog-api.dyremoon.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>Dyrelog</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="card">
    <div class="update-banner" id="update-banner" hidden title="Click to update">
      <span id="update-banner-text">Update available</span>
      <button class="update-banner-dismiss" id="update-banner-dismiss" title="Hide until Dyrelog restarts">&times;</button>
    </div>
    <div class="header" id="drag-region">
      <div class="brand"><img class="brand-logo" src="logo.png" alt=""><span class="status-dot" id="status-dot"></span><span class="wordmark" id="wordmark">DYRELOG</span></div>
      <div class="icons">
        <button class="icon-btn" id="btn-settings" data-tooltip="Settings"><svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.02 5.98l-2.12 2.12M8.1 15.9l-2.12 2.12M18.02 18.02l-2.12-2.12M8.1 8.1L5.98 5.98"/></svg></button>
        <button class="icon-btn" id="btn-analysis" data-tooltip="Combat Analysis">&#128202;</button>
        <button class="icon-btn" id="btn-leaderboard" data-tooltip="Leaderboards">&#127942;</button>
        <button class="icon-btn" id="btn-circle" data-tooltip="Switch to Circle">&#9711;</button>
        <button class="icon-btn" id="btn-pets" data-tooltip="Show pets separately">♙</button>
        <button class="icon-btn" id="btn-mini" data-tooltip="Switch to Mini">&#8212;</button>
        <button class="icon-btn" id="btn-close" data-tooltip="Close">&times;</button>
      </div>
    </div>
    <div class="icon-tooltip" id="icon-tooltip" hidden></div>

    <div class="empty-state" id="empty-state">
      <div class="empty-copy">Pick your EverQuest folder once and Dyrelog remembers it. No log yet? In game, type <b>/log on</b>.</div>
      <div class="empty-actions">
        <button class="pill-btn" id="btn-pick-folder">Pick EverQuest folder&hellip;</button>
        <button class="pill-btn" id="btn-pick-file">Pick log file&hellip;</button>
      </div>
    </div>

    <div class="folder-pick" id="folder-pick" hidden>
      <div class="empty-copy">That folder has more than one log. Which character?</div>
      <select id="folder-select"></select>
      <button class="pill-btn" id="btn-folder-use">Use this one</button>
    </div>

    <div class="fight-view" id="fight-view" hidden>
      <div class="subhead">
        <span class="mob-line" id="mob-line">
          <button type="button" class="fight-select" id="fight-select" title="Pick a recent fight">Waiting for a fight&hellip;</button>
          <span id="mob-diff" class="diff"></span>
        </span>
        <span class="dps-side">
          <span class="fight-timer" id="fight-timer"></span>
          <span class="fight-total" id="fight-total"></span>
        </span>
      </div>
      <div class="fight-popup" id="fight-popup" hidden></div>
      <div class="barlist" id="barlist"></div>
      <div class="submit-row" id="submit-row" hidden>
        <button class="submit-pill" id="btn-submit">&uarr; Submit</button>
      </div>
      <div class="auto-submit-line" id="auto-submit-line" hidden></div>
      <!-- First-run only (see settings.autoSubmitChosen in app.js) — once
           you pick one, this row never shows again; the same three
           choices live permanently in Settings after that. -->
      <div class="auto-submit-toggles" id="auto-submit-toggles" hidden>
        <button class="toggle-btn" data-mode="off">Off</button>
        <button class="toggle-btn" data-mode="ask">Ask</button>
        <button class="toggle-btn" data-mode="auto">Auto</button>
      </div>
    </div>

    <div class="mini-bar" id="mini-bar">
      <span class="status-dot" id="mini-dot"></span>
      <div class="mini-info">
        <div class="mini-info-line">
          <span class="mini-timer" id="mini-timer">0:00</span>
      <div class="mini-actions">
        <button class="icon-btn mini-settings" id="btn-mini-settings" title="Settings"><svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.02 5.98l-2.12 2.12M8.1 15.9l-2.12 2.12M18.02 18.02l-2.12-2.12M8.1 8.1L5.98 5.98"/></svg></button>
        <button class="icon-btn mini-pets-toggle" id="btn-mini-pets" title="Show pets separately">♙</button>
        <button class="icon-btn mini-circle" id="btn-mini-circle" title="Switch to Circle">&#9711;</button>
        <button class="icon-btn mini-restore" id="btn-restore" title="Switch to Bars"><svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17" x2="18" y2="17"/></svg></button>
      </div>
          <div class="mini-total" id="mini-total"></div>
        </div>
        <div class="mini-main">
          <span class="mini-name" id="mini-name">Dyrelog</span>
          <span class="mini-dps" id="mini-dps">0 dps</span>
        </div>
        <!-- Only shown when your pet has actually dealt damage this fight
             — see updateMiniBar() in app.js. -->
        <div class="mini-pet-row" id="mini-pet-row" hidden>
          <span class="mini-pet-name" id="mini-pet-name"></span>
          <span class="mini-pet-dps" id="mini-pet-dps"></span>
        </div>
        <div class="mini-party-list" id="mini-party-list"></div>
      </div>
    </div>

    <div class="watch-badge" id="watch-badge" title="Right-click for the menu">
      <button class="watch-menu-btn" id="watch-menu-btn" title="Menu"><svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.02 5.98l-2.12 2.12M8.1 15.9l-2.12 2.12M18.02 18.02l-2.12-2.12M8.1 8.1L5.98 5.98"/></svg></button>
      <button class="watch-mini-btn" id="watch-mini-btn" title="Switch to Mini">&#8212;</button>
      <button class="watch-bars-btn" id="watch-bars-btn" title="Switch to Bars"><svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17" x2="18" y2="17"/></svg></button>
      <button class="watch-pets-btn" id="watch-pets-btn" title="Show pets separately">♙</button>
      <div class="watch-dps"><span id="watch-dps-num">0</span><span class="watch-unit">dps</span></div>
      <div class="watch-pet" id="watch-pet" hidden></div>
      <div class="watch-timer" id="watch-timer">0:00</div>
    </div>

    <!-- Manual resize — right/bottom edges and the corner only (top-left
         stays anchored where you put the window). See wireResizeHandle()
         in app.js. -->
    <div class="resize-handle resize-right" id="rh-right"></div>
    <div class="resize-handle resize-bottom" id="rh-bottom"></div>
    <div class="resize-handle resize-corner" id="rh-corner"></div>
  </div>

  <script src="eqp-core.js"></script>
  <script src="completed-kills.js"></script>
  <script src="appearance.js"></script>
  <script src="submission-audio.js"></script>
  <script src="window-drag.js"></script>
  <script src="first-run-policy.js"></script>
  <script src="live-stream.js"></script>
  <script src="app.js"></script>
</body>
</html>
