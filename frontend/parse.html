<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dyrelog — EverQuest Legends Parse</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./css/dyrelog.css" />
  <link rel="icon" type="image/png" href="./assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="./assets/logo-180.png" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="wordmark"><img class="logo-mark" src="./assets/logo-64.png" alt="" width="28" height="28">Dyrelog<span class="game-badge">EverQuest Legends</span></div>
      <nav class="site-nav">
        <a href="./index.html" class="active">Leaderboards</a>
        <a href="./analyze.html">Analyze Log</a>
        <a href="./about.html">About</a>
        <a href="./download.html">Download Dyrelog</a>
        <span id="auth-slot"></span>
      </nav>
    </header>

    <main>
      <div id="parse-header" style="margin-bottom:20px;">
        <h1 id="parse-boss">Loading…</h1>
        <p class="muted" id="parse-meta"></p>
      </div>

      <div class="plate">
        <div id="parse-table"><p class="muted">Loading…</p></div>
      </div>
    </main>

    <footer class="site-footer">
      Dyrelog is an unofficial fan project. Not affiliated with Daybreak
      Game Company or EverQuest Legends.
    </footer>
  </div>

  <script>window.DYRELOG_API_BASE = 'https://dyrelog-api.dyremoon.workers.dev';</script>
  <script src="./js/app.js"></script>
  <script>
    async function loadParse() {
      const id = new URLSearchParams(window.location.search).get('id');
      const tableEl = document.getElementById('parse-table');
      if (!id) {
        document.getElementById('parse-boss').textContent = 'No parse selected';
        return;
      }
      try {
        const { encounter, parses } = await api(`/api/encounters/${id}`);
        document.getElementById('parse-boss').textContent = encounter.boss_name || 'Unmatched boss';
        document.getElementById('parse-meta').textContent =
          `${fmtDate(encounter.start_time)} · ${encounter.killed ? 'Killed' : 'Not killed'} · ` +
          `${fmtNumber(encounter.raid_dps)} raid DPS`;

        if (parses.length === 0) {
          tableEl.innerHTML = '<p class="empty-state">No parses recorded for this encounter.</p>';
          return;
        }
        tableEl.innerHTML = `
          <table>
            <thead>
              <tr><th>#</th><th>Character</th><th>Class</th><th class="num">DPS</th><th class="num">Damage</th><th class="num">Hits</th><th class="num">Crits</th></tr>
            </thead>
            <tbody>
              ${parses
                .map(
                  (p, i) => `
                <tr>
                  <td class="mono">${i + 1}</td>
                  <td>${p.character_name} <span class="muted">(${p.realm})</span></td>
                  <td class="muted">${p.class_combo || '—'}</td>
                  <td class="num tabular">${fmtNumber(p.dps)}</td>
                  <td class="num tabular">${fmtNumber(p.damage)}</td>
                  <td class="num tabular">${p.hits}</td>
                  <td class="num tabular">${p.crits}</td>
                </tr>`
                )
                .join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        document.getElementById('parse-boss').textContent = "Can't load this parse";
        tableEl.innerHTML = `<p class="empty-state">This parse isn't available! It may still be under review, or the link is wrong.</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadParse);
  </script>
</body>
</html>
