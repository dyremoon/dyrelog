<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dyrelog — EverQuest Legends Boss DPS Leaderboard</title>
  <meta name="description" content="EverQuest Legends DPS leaderboard by boss — top parses submitted from the Dyrelog overlay, re-verified server-side." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./css/dyrelog.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="wordmark">Dyrelog</div>
      <nav class="site-nav">
        <a href="./index.html">Leaderboards</a>
        <span id="auth-slot"></span>
      </nav>
    </header>

    <main>
      <div id="boss-header" style="margin-bottom:20px;">
        <h1 id="boss-name">Loading…</h1>
        <p class="muted" id="boss-zone"></p>
      </div>

      <div class="plate">
        <h2>Top parses</h2>
        <div id="parse-list">
          <p class="muted">Loading…</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      Dyrelog is an unofficial fan project. Not affiliated with Daybreak
      Game Company or EverQuest Legends.
    </footer>
  </div>

  <script src="./js/app.js"></script>
  <script>
    async function loadLeaderboard() {
      const bossId = new URLSearchParams(window.location.search).get('id');
      const listEl = document.getElementById('parse-list');
      if (!bossId) {
        document.getElementById('boss-name').textContent = 'No boss selected';
        return;
      }
      try {
        const { boss, parses } = await api(`/api/bosses/${bossId}/leaderboard`);
        document.getElementById('boss-name').textContent = boss.name;
        document.getElementById('boss-zone').textContent = boss.zone || '';

        if (parses.length === 0) {
          listEl.innerHTML = '<p class="empty-state">No verified parses for this boss yet — be the first to submit one.</p>';
          return;
        }
        listEl.innerHTML = `
          <table>
            <thead>
              <tr><th>#</th><th>Character</th><th>Class</th><th class="num">DPS</th><th class="num">Damage</th><th>When</th></tr>
            </thead>
            <tbody>
              ${parses
                .map(
                  (p, i) => `
                <tr>
                  <td class="mono">${i + 1}</td>
                  <td><a href="./parse.html?id=${p.encounter_id}">${p.character_name}</a> <span class="muted">(${p.realm})</span></td>
                  <td class="muted">${p.class_combo || '—'}</td>
                  <td class="num tabular">${fmtNumber(p.dps)}</td>
                  <td class="num tabular">${fmtNumber(p.damage)}</td>
                  <td class="muted">${fmtDate(p.start_time)}</td>
                </tr>`
                )
                .join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        listEl.innerHTML = `<p class="empty-state">Can't reach the API right now.</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadLeaderboard);
  </script>
</body>
</html>
