<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dyrelog — Character Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./css/dyrelog.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="wordmark">Dyrelog</div>
      <nav class="site-nav">
        <a href="./index.html">Leaderboards</a>
        <span id="auth-slot"></span>
      </nav>
    </header>

    <main>
      <div class="plate">
        <h2>Your characters</h2>
        <div id="char-list"><p class="muted">Loading…</p></div>
      </div>
    </main>

    <footer class="site-footer">
      Dyrelog is an unofficial fan project. Not affiliated with Daybreak
      Game Company or EverQuest Legends.
    </footer>
  </div>

  <script src="./js/app.js"></script>
  <script>
    async function loadProfile() {
      const listEl = document.getElementById('char-list');
      try {
        const { user, characters } = await api('/api/me');
        if (!user) {
          listEl.innerHTML = `<p class="empty-state">Log in with Discord to see your characters.</p>`;
          return;
        }
        if (characters.length === 0) {
          listEl.innerHTML = `<p class="empty-state">No characters linked yet — a character links automatically the first time you submit a fight from the overlay.</p>`;
          return;
        }
        listEl.innerHTML = `
          <table>
            <thead><tr><th>Character</th><th>Realm</th><th>Class</th><th>Linked</th></tr></thead>
            <tbody>
              ${characters
                .map(
                  (c) => `
                <tr>
                  <td>${c.character_name}</td>
                  <td class="muted">${c.realm}</td>
                  <td class="muted">${c.class_combo || '—'}</td>
                  <td class="muted">${fmtDate(c.linked_at)}</td>
                </tr>`
                )
                .join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        listEl.innerHTML = `<p class="empty-state">Can't reach the API right now.</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
